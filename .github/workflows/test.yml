name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python image/make_cidata.py
      - run: python -m unittest discover -s tests -p 'test*.py' -v
      - run: python image/make_cidata.py --check
      - run: python image/test_image_contracts.py
      - run: python scripts/package.py

  windows-powershell:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - shell: powershell
        run: python .\image\make_cidata.py
      - shell: powershell
        run: .\tests\Test-Static.ps1

  windows-installer:
    runs-on: windows-2025
    needs: [contracts, windows-powershell]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build unsigned test installer
        shell: powershell
        run: .\scripts\Build-Installer.ps1
      - name: Verify installer checksum
        shell: powershell
        run: |
          $version = (Get-Content .\config\runtime.lock.json -Raw | ConvertFrom-Json).product.version
          $artifact = ".\dist\Windows-Into-Omarchy-v$version-setup-unsigned.exe"
          $line = Get-Content .\dist\SHA256SUMS | Where-Object { $_ -match [regex]::Escape((Split-Path -Leaf $artifact)) }
          if (-not $line) { throw 'Installer checksum entry is missing.' }
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Installer checksum mismatch.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Into-Omarchy-v0.3.0-unsigned
          path: |
            dist/Windows-Into-Omarchy-v0.3.0-setup-unsigned.exe
            dist/SHA256SUMS
          if-no-files-found: error
