name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tests/test_contracts.py
      - run: python scripts/package.py

  windows-powershell:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: .\tests\Test-Static.ps1
