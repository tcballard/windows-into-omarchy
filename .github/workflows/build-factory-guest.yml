name: build-factory-guest

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Create a protected draft release after the KVM build
        required: true
        type: boolean
        default: false
      release_tag:
        description: New immutable factory guest tag
        required: true
        type: string
        default: omarchy-4.0.1-x86_64-factory.1

concurrency:
  group: omarchy-factory-guest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 guest/tests/test_factory_contracts.py
      - run: bash -n guest/build.sh guest/audit.sh guest/extract-metadata.sh

  build:
    needs: contracts
    if: >-
      github.repository == 'tcballard/windows-into-omarchy' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: [self-hosted, linux, x64, omarchy-factory-builder]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prove dedicated KVM builder capabilities
        run: |
          test -c /dev/kvm
          command -v curl guestfish jq python3 qemu-img qemu-system-x86_64 sha256sum split tar zstd
      - name: Build, audit, inventory, and package factory guest
        env:
          WIO_FACTORY_REQUIRE_KVM: '1'
        run: |
          ./guest/build.sh \
            --accel kvm \
            --output-dir "$RUNNER_TEMP/omarchy-factory-guest" \
            --cache-dir "$RUNNER_TEMP/omarchy-factory-cache"
      - name: Upload short-lived release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omarchy-factory-guest-${{ github.run_id }}
          path: ${{ runner.temp }}/omarchy-factory-guest/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft-release:
    needs: build
    if: inputs.create_draft_release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: factory-guest-release
    permissions:
      contents: write
    steps:
      - name: Validate immutable release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^omarchy-4\.0\.1-x86_64-factory\.[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: omarchy-factory-guest-${{ github.run_id }}
          path: factory-release
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: source
      - name: Verify complete candidate independently
        run: |
          command -v zstd
          (cd factory-release && sha256sum --check SHA256SUMS)
          python3 source/guest/scripts/verify_release.py --verify-expanded factory-release
      - name: Create protected draft release only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to replace existing release $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" factory-release/* \
            --target "$GITHUB_SHA" --draft \
            --title "Windows Into Omarchy factory guest ($RELEASE_TAG)" \
            --notes "Unowned, SBOM-inventoried x86_64 Omarchy factory guest. Do not publish until physical Windows first-owner testing and distribution review are complete."
