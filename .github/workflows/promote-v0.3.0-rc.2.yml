name: prepare-v0.3.0-rc.2-bootstrap-release

on:
  workflow_dispatch:

concurrency:
  group: prepare-v0.3.0-rc.2-bootstrap-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  TAG: v0.3.0-rc.2
  RELEASE_COMMIT: 1600cec127d657f9a233acf7cbe66108e1562e87
  RELEASE_RUN_ID: '33014004895'
  RELEASE_RUN_SHA: a5ce3a8cbf64bc5382257c76fb60474dae2ffdef
  RELEASE_ARTIFACT_ID: '9623937267'
  RELEASE_ARTIFACT_NAME: bootstrap-v0.3.0-rc.2-33014004895
  RELEASE_ARTIFACT_DIGEST: sha256:beddca0f9634a65f795c2306326ef7e6859f53226f73c9e675b26c63e711fb0f

jobs:
  create-permanent-draft:
    if: >-
      github.repository == 'tcballard/windows-into-omarchy' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: factory-v0.3.0-draft
    permissions:
      actions: read
      contents: write
    steps:
      - name: Prove the exact prebuilt release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")
          test "$(jq -r .head_sha <<<"$run")" = "$RELEASE_RUN_SHA"
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100")
          built=$(jq '[.jobs[] | select(.name == "build-bootstrap" and .conclusion == "success")] | length' <<<"$jobs")
          test "$built" -eq 1
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100")
          matches=$(jq --argjson id "$RELEASE_ARTIFACT_ID" '[.artifacts[] | select(.id == $id)]' <<<"$artifacts")
          test "$(jq 'length' <<<"$matches")" -eq 1
          test "$(jq -r '.[0].name' <<<"$matches")" = "$RELEASE_ARTIFACT_NAME"
          test "$(jq -r '.[0].digest' <<<"$matches")" = "$RELEASE_ARTIFACT_DIGEST"
          test "$(jq -r '.[0].expired' <<<"$matches")" = false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: release
          github-token: ${{ github.token }}
          repository: tcballard/windows-into-omarchy
          run-id: ${{ env.RELEASE_RUN_ID }}

      - name: Verify release bundle before upload
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          test "$(jq -r .releaseTag release/factory-release.json)" = "$TAG"
          test "$(jq -r .deliveryMode release/release-report.json)" = online-bootstrap
          test "$(jq -r .releaseState release/release-report.json)" = draft-engineering-prerelease
          test "$(jq -r .releaseCommit release/release-report.json)" = "$RELEASE_COMMIT"
          test -z "$(find release -maxdepth 1 -type f -size +2147483647c -print -quit)"
          test "$(find release -maxdepth 1 -type f -name '*.part*' | wc -l)" -gt 0

      - name: Create or resume the exact annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null); then
            test "$(jq -r .object.type <<<"$ref")" = tag
            tag_sha=$(jq -r .object.sha <<<"$ref")
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.sha)" = "$RELEASE_COMMIT"
          else
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" \
              -f message='Windows Into Omarchy v0.3.0-rc.2 online bootstrap candidate' \
              -f object="$RELEASE_COMMIT" \
              -f type=commit \
              --jq .sha)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_object" >/dev/null
          fi

      - name: Create or resume the persistent draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Windows Into Omarchy v0.3.0-rc.2 is an unsigned engineering prerelease candidate.

          Once this draft is published, testers download only `Windows-Into-Omarchy-v0.3.0-setup-unsigned.exe`. The installer embeds a manifest bound to this exact release; first launch downloads the supporting runtime and Omarchy factory parts automatically, verifies every SHA-256, reconstructs both archives, verifies the expanded payloads, and starts the contained VM.

          Expect roughly 4 GB of verified downloads on first preparation. Windows SmartScreen will warn because this engineering installer is not Authenticode-signed. Automated source, guest, runtime and assembly gates passed; physical Windows 11 acceptance, signing, and final binary redistribution review remain required before publishing this draft.

          Windows Into Omarchy is independent and is not affiliated with or endorsed by Omarchy, Basecamp, Omacom, Microsoft, QEMU, or Try Omarchy.
          EOF
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          matching=$(jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag)]' <<<"$releases")
          test "$(jq 'length' <<<"$matching")" -le 1
          if test "$(jq 'length' <<<"$matching")" -eq 0; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --prerelease \
              --latest=false \
              --title 'Windows Into Omarchy v0.3.0-rc.2' \
              --notes-file release-notes.md
            releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
            matching=$(jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag)]' <<<"$releases")
          fi
          test "$(jq 'length' <<<"$matching")" -eq 1
          test "$(jq -r '.[0].draft' <<<"$matching")" = true
          test "$(jq -r '.[0].prerelease' <<<"$matching")" = true
          release_id=$(jq -r '.[0].id' <<<"$matching")
          test "$release_id" -gt 0
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Upload every missing asset without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            expected_size=$(stat -c %s "$file")
            expected_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
            matches=$(jq --arg name "$name" '[.assets[] | select(.name == $name)]' <<<"$release")
            test "$(jq 'length' <<<"$matches")" -le 1
            asset=$(jq -c '.[0] // empty' <<<"$matches")
            if test -n "$asset" && test "$(jq -r .state <<<"$asset")" = starter; then
              asset_id=$(jq -r .id <<<"$asset")
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              asset=''
            fi
            if test -n "$asset"; then
              test "$(jq -r .state <<<"$asset")" = uploaded
              test "$(jq -r .size <<<"$asset")" -eq "$expected_size"
              test "$(jq -r .digest <<<"$asset")" = "$expected_digest"
            else
              encoded_name=$(jq -rn --arg value "$name" '$value | @uri')
              # Stream multi-GiB assets; --data-binary buffers the file in runner memory.
              curl --location --fail-with-body --show-error --silent \
                --retry 2 --retry-delay 10 --retry-all-errors \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --header 'Content-Type: application/octet-stream' \
                --upload-file "$file" \
                --output upload-response.json \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name"
              uploaded=$(cat upload-response.json)
              test "$(jq -r .name <<<"$uploaded")" = "$name"
              test "$(jq -r .state <<<"$uploaded")" = uploaded
              test "$(jq -r .size <<<"$uploaded")" -eq "$expected_size"
              test "$(jq -r .digest <<<"$uploaded")" = "$expected_digest"
            fi
          done < <(find release -maxdepth 1 -type f -print0 | sort -z)

      - name: Verify the permanent draft asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r .tag_name <<<"$release_json")" = "$TAG"
          test "$(jq -r .draft <<<"$release_json")" = true
          test "$(jq -r .prerelease <<<"$release_json")" = true
          test "$(jq -r .published_at <<<"$release_json")" = null
          expected_count=$(find release -maxdepth 1 -type f | wc -l)
          test "$(jq '.assets | length' <<<"$release_json")" -eq "$expected_count"
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            expected_size=$(stat -c %s "$file")
            expected_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            asset=$(jq --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release_json")
            test "$(jq -r .size <<<"$asset")" -eq "$expected_size"
            test "$(jq -r .digest <<<"$asset")" = "$expected_digest"
          done < <(find release -maxdepth 1 -type f -print0)
